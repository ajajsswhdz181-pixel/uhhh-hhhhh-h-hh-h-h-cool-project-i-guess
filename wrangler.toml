name = "tricepbicept123"
main = "src/index.js"
compatibility_date = "2026-04-07" 
# Optional. Uncomment and set to require a shared-secret bearer token on
# both the /mcp endpoint (Authorization: Bearer <token>) and the /ws
# endpoint (?token=<token> query param, since browser WebSocket clients
# can't set custom headers). Leave unset while testing locally.
# [vars]
# MCP_AUTH_TOKEN = "change-me"
# CALL_TIMEOUT_MS = "55000"
# MANIFEST_TIMEOUT_MS = "5000" 
[[durable_objects.bindings]]
name = "MCP_BRIDGE"
class_name = "McpBridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["McpBridge"]
